<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDTV TOP100 総合分析</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="page-header">
  <div>
    <h1>CDTV TOP100 総合分析</h1>
    <p>CSVはブラウザ内で処理します。GitHubへアップロードされません。</p>
  </div>
</header>

<main class="page-main">
  <section class="card">
    <h2>1. CSVと集計条件</h2>
    <div class="controls">
      <div class="control wide">
        <label for="csvFile">CSVファイル</label>
        <input id="csvFile" type="file" accept=".csv,text/csv">
      </div>
      <div class="control">
        <label for="pointMode">ポイント方式</label>
        <select id="pointMode">
          <option value="log" selected>対数ポイント</option>
          <option value="linear">101 - 順位</option>
          <option value="reciprocal">100 / 順位</option>
        </select>
      </div>
      <div class="control">
        <label for="topN">ランキング表示件数</label>
        <select id="topN">
          <option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option>
        </select>
      </div>
      <div class="control">
        <label for="startDate">開始週</label>
        <input id="startDate" type="date">
      </div>
      <div class="control">
        <label for="endDate">終了週</label>
        <input id="endDate" type="date">
      </div>
      <div class="control button-control">
        <button id="applyFilter" class="primary">期間を適用</button>
      </div>
      <div class="control button-control">
        <button id="resetFilter">全期間に戻す</button>
      </div>
    </div>
    <div id="status" class="notice">CSVを選択してください。</div>
  </section>

  <section id="summaryCard" class="card" hidden>
    <h2>2. データ概要</h2>
    <div id="summary" class="summary-grid"></div>
    <div id="edgeWarning"></div>
  </section>

  <section id="artistScopeCard" class="card" hidden>
    <h2>3. 週間アーティスト分析の対象</h2>
    <div class="controls">
      <div class="control">
        <label for="artistScopeMode">対象範囲</label>
        <select id="artistScopeMode">
          <option value="top" selected>総合ポイント上位から指定件数</option>
          <option value="all">全アーティスト</option>
          <option value="selected">選択したアーティストのみ</option>
        </select>
      </div>
      <div class="control">
        <label for="artistCount">表示アーティスト数</label>
        <input id="artistCount" type="number" value="10" min="1" step="1">
      </div>
      <div class="control wide">
        <label for="artistPicker">個別選択（Ctrl/⌘で複数選択）</label>
        <select id="artistPicker" multiple size="6"></select>
      </div>
    </div>
    <p id="artistScopeNote" class="muted"></p>
  </section>

  <section id="menuCard" class="card" hidden>
    <h2>4. 分析メニュー</h2>

    <h3>曲</h3>
    <div class="menu-grid">
      <button data-action="songPoints">曲別ポイント</button>
      <button data-action="songWeeks">登場週数</button>
      <button data-action="songStreak">最長連続登場</button>
      <button data-action="songTop10">TOP10滞在</button>
      <button data-action="songNo1">1位獲得週</button>
      <button data-action="lateBloomers">遅咲き曲</button>
      <button data-action="stableSongs">順位安定曲</button>
      <button data-action="volatileSongs">乱高下曲</button>
      <button data-action="reentries">再登場回数</button>
      <button data-action="biggestRise">週間最大上昇</button>
      <button data-action="biggestFall">週間最大下落</button>
      <button data-action="peakDelay">ピーク到達が遅い曲</button>
      <button data-action="earlyHit">初動依存度</button>
      <button data-action="longTail">後半持続型</button>
      <button data-action="pointCompare">3ポイント方式比較</button>
    </div>

    <h3>アーティスト総合</h3>
    <div class="menu-grid">
      <button data-action="artistPoints">総合ポイント</button>
      <button data-action="artistSongs">曲数</button>
      <button data-action="artistChartWeeks">登場週数</button>
      <button data-action="artistTop10">TOP10曲週</button>
      <button data-action="artistNo1">1位曲週</button>
      <button data-action="artistEfficiency">1曲あたりポイント</button>
      <button data-action="artistWeeklyEfficiency">登場週あたりポイント</button>
      <button data-action="artistSimultaneous">同時ランクイン最大</button>
    </div>

    <h3>週間アーティスト変遷（数値表＋グラフ）</h3>
    <div class="menu-grid">
      <button data-action="weeklyArtistPoints">週間ポイント</button>
      <button data-action="weeklyArtistCumulative">累積ポイント</button>
      <button data-action="weeklyArtistShare">週間シェア</button>
      <button data-action="weeklyArtistSongs">ランクイン曲数</button>
      <button data-action="weeklyArtistTop10Songs">TOP10曲数</button>
      <button data-action="weeklyArtistTop20Songs">TOP20曲数</button>
      <button data-action="weeklyArtistNo1Songs">1位曲数</button>
      <button data-action="weeklyArtistBestRank">最高順位</button>
      <button data-action="weeklyArtistAvgRank">平均順位</button>
      <button data-action="weeklyArtistMedianRank">中央値順位</button>
    </div>

    <h3>週・市場</h3>
    <div class="menu-grid">
      <button data-action="weeklyMarket">週別市場統計</button>
      <button data-action="artistConcentration">アーティスト集中度</button>
      <button data-action="songConcentration">曲順位ポイント集中度</button>
      <button data-action="weeklyTurnover">新規・脱落・再登場</button>
      <button data-action="weeklyNo1">週間1位変遷</button>
      <button data-action="weeklyTop10">週間TOP10一覧</button>
      <button data-action="quality">データ品質チェック</button>
    </div>
  </section>

  <section id="searchCard" class="card" hidden>
    <h2>5. 個別検索</h2>
    <div class="search-grid">
      <div>
        <label for="songSearch">曲名 / アーティストから曲を検索</label>
        <input id="songSearch" type="search" placeholder="例: ロビンソン / スピッツ">
        <div id="songSearchResults" class="search-results"></div>
      </div>
      <div>
        <label for="artistSearch">アーティストを検索</label>
        <input id="artistSearch" type="search" placeholder="例: Mr.Children">
        <div id="artistSearchResults" class="search-results"></div>
      </div>
    </div>
  </section>

  <section id="resultCard" class="card" hidden>
    <div class="result-heading">
      <div>
        <h2 id="resultTitle">結果</h2>
        <div id="resultInfo" class="muted"></div>
      </div>
      <button id="exportTable" class="compact">現在の表をCSV保存</button>
    </div>
    <div id="resultTable"></div>
  </section>

  <section id="chartCard" class="card" hidden>
    <h2 id="chartTitle">グラフ</h2>
    <p id="chartWarning" class="muted"></p>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </section>
</main>

<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>

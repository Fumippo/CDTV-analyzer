<!DOCTYPE html>
<html lang="ja">
<head>

      --text: #20242c;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    header,
    main {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      padding: 24px 16px 8px;
    }

    main {
      padding: 8px 16px 48px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    h3 {
      margin: 16px 0 8px;
      font-size: 16px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .card {

      border: 1px solid var(--border);
      border-radius: 14px;

    .controls {

      margin-top: 10px;

      border-radius: 9px;

      gap: 8px;

    }

    .table-wrap {

      max-height: 680px;

      border-radius: 10px;

    table {
      width: 100%;

      background: #fff;

    th,

<main>

<script>

"use strict";


// ============================================================
// グローバル
// ============================================================

let allLoadedRows = [];

let rows = [];

let allWeeks = [];

let songStats = [];

let artistStats = [];

let currentChart = null;


let currentTable = {

  headers: [],

  rows: [],

  filename: "analysis.csv"

};


const $ =
  id =>
    document.getElementById(id);


// ============================================================
// 基本
// ============================================================

function esc(v) {

  return String(v ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    );

}


function mean(a) {

  return a.length

    ? a.reduce(
        (x, y) => x + y,
        0
      ) / a.length

    : 0;

}


function median(a) {

  if (!a.length) {
    return 0;
  }


  const b =
    [...a]
      .sort(
        (x, y) => x - y
      );


  const m =
    Math.floor(
      b.length / 2
    );


  return b.length % 2

    ? b[m]

    : (
        b[m - 1]
        +
        b[m]
      ) / 2;

}


function stddev(a) {

  if (!a.length) {
    return 0;
  }


  const m =
    mean(a);


  return Math.sqrt(

    mean(

      a.map(
        x =>
          (x - m) ** 2
      )

    )

  );

}


// ============================================================
// ポイント
// ============================================================

function point(
  rank,
  mode = $("pointMode").value
) {

  if (
    mode === "linear"
  ) {

    return 101 - rank;

  }


  if (
    mode === "reciprocal"
  ) {

    return 100 / rank;

  }


  /*
    対数ポイント

    1位   = 100
    10位 ≒ 50.5
    100位 = 1
  */

  return (

    1

    +

    99
    *
    (
      1
      -
      Math.log10(rank) / 2
    )

  );

}


function pointLabel(
  mode = $("pointMode").value
) {

  if (
    mode === "linear"
  ) {

    return "101-順位";

  }


  if (
    mode === "reciprocal"
  ) {

    return "100/順位";

  }


  return "対数ポイント";

}


// ============================================================
// CSV
// ============================================================

function normalizeRow(r) {

  const week =
    String(
      r["週"] || ""
    ).trim();


  const rank =
    Number.parseInt(
      r["順位"],
      10
    );


  const song =
    String(

      r["正規化曲名"]

      ||

      r["曲名"]

      ||

      ""

    ).trim();


  const artist =
    String(

      r["正規化アーティスト"]

      ||

      r["アーティスト"]

      ||

      ""

    ).trim();


  const mainArtist =
    String(

      r["主要アーティスト"]

      ||

      artist

    ).trim();


  const productId =
    String(

      r["商品ID"]

      ||

      r["曲ID"]

      ||

      `${artist}||${song}`

    ).trim();


  return {

    raw: r,

    week,

    rank,

    song,

    artist,

    mainArtist,

    productId

  };

}


function validateRequiredColumns(
  fields
) {

  const required = [

    "週",

    "順位",

    "曲名",

    "アーティスト"

  ];


  return required.filter(
    c =>
      !fields.includes(c)
  );

}


// ============================================================
// 期間
// ============================================================

function applyDateFilter() {

  const start =
    $("startDate").value;


  const end =
    $("endDate").value;


  rows =
    allLoadedRows.filter(
      r => {

        if (
          start
          &&
          r.week < start
        ) {

          return false;

        }


        if (
          end
          &&
          r.week > end
        ) {

          return false;

        }


        return true;

      }
    );


  allWeeks =
    [
      ...new Set(
        rows.map(
          r => r.week
        )
      )
    ]
    .sort();


  rebuild();

  showSummary();

}


// ============================================================
// 再集計
// ============================================================

function rebuild() {

  buildSongStats();

  buildArtistStats();

}


// ============================================================
// 連続登場
// ============================================================

function longestStreak(
  weeks
) {

  const present =
    new Set(weeks);


  let best = 0;

  let cur = 0;


  for (
    const w
    of allWeeks
  ) {

    if (
      present.has(w)
    ) {

      cur++;

      best =
        Math.max(
          best,
          cur
        );

    }

    else {

      cur = 0;

    }

  }


  return best;

}


// ============================================================
// 再登場
// ============================================================

function countReentries(
  weeks
) {

  const present =
    new Set(weeks);


  let seen = false;

  let gap = false;

  let n = 0;


  for (
    const w
    of allWeeks
  ) {

    const now =
      present.has(w);


    if (now) {

      if (
        seen
        &&
        gap
      ) {

        n++;

      }


      seen = true;

      gap = false;

    }

    else if (seen) {

      gap = true;

    }

  }


  return n;

}


// ============================================================
// 上昇・下落
// ============================================================

function adjacentChanges(
  items
) {

  let rise = 0;

  let fall = 0;

  let reentryRise = 0;


  for (
    let i = 1;
    i < items.length;
    i++
  ) {

    const a =
      items[i - 1];


    const b =
      items[i];


    const ai =
      allWeeks.indexOf(
        a.week
      );


    const bi =
      allWeeks.indexOf(
        b.week
      );


    const diff =
      a.rank
      -
      b.rank;


    /*
      隣接ランキング週だけ
      通常上昇として扱う
    */

    if (
      bi === ai + 1
    ) {

      rise =
        Math.max(
          rise,
          diff
        );


      fall =
        Math.max(
          fall,
          -diff
        );

    }

    else {

      reentryRise =
        Math.max(
          reentryRise,
          diff
        );

    }

  }


  return {

    rise,

    fall,

    reentryRise

  };

}


// ============================================================
// 曲別統計
// ============================================================

function buildSongStatsForMode(
  mode
) {

  const groups =
    new Map();


  for (
    const r
    of rows
  ) {

    const key =
      `${r.song}\u0000${r.artist}`;


    if (
      !groups.has(key)
    ) {

      groups.set(
        key,
        []
      );

    }


    groups
      .get(key)
      .push(r);

  }


  const result = [];


  for (
    const [key, rawItems]
    of groups.entries()
  ) {

    const items =
      [...rawItems]
        .sort(
          (a, b) =>
            a.week.localeCompare(
              b.week
            )
        );


    const ranks =
      items.map(
        x => x.rank
      );


    const weeks =
      items.map(
        x => x.week
      );


    const first =
      items[0];


    const last =
      items[
        items.length - 1
      ];


    const bestRank =
      Math.min(
        ...ranks
      );


    const bestIndex =
      items.findIndex(
        x =>
          x.rank === bestRank
      );


    const changes =
      adjacentChanges(
        items
      );


    const totalPoints =
      items.reduce(

        (s, x) =>
          s
          +
          point(
            x.rank,
            mode
          ),

        0

      );


    const first3Points =
      items
        .slice(
          0,
          3
        )
        .reduce(

          (s, x) =>
            s
            +
            point(
              x.rank,
              mode
            ),

          0

        );


    result.push({

      key,

      song:
        first.song,

      artist:
        first.artist,

      entries:
        items,

      points:
        totalPoints,

      weeks:
        items.length,

      streak:
        longestStreak(
          weeks
        ),

      reentries:
        countReentries(
          weeks
        ),

      bestRank,

      worstRank:
        Math.max(
          ...ranks
        ),

      avgRank:
        mean(
          ranks
        ),

      medianRank:
        median(
          ranks
        ),

      rankStd:
        stddev(
          ranks
        ),

      no1Weeks:
        ranks.filter(
          x => x === 1
        ).length,

      top3Weeks:
        ranks.filter(
          x => x <= 3
        ).length,

      top10Weeks:
        ranks.filter(
          x => x <= 10
        ).length,

      top20Weeks:
        ranks.filter(
          x => x <= 20
        ).length,

      firstDate:
        first.week,

      lastDate:
        last.week,

      debutRank:
        first.rank,

      lastRank:
        last.rank,

      debutToBest:
        first.rank
        -
        bestRank,

      weeksToPeak:
        bestIndex,

      biggestRise:
        changes.rise,

      biggestFall:
        changes.fall,

      biggestReentryRise:
        changes.reentryRise,

      earlyShare:
        totalPoints
          ? first3Points
            /
            totalPoints
          : 0,

      leftCensored:
        first.week
        ===
        allWeeks[0],

      rightCensored:
        last.week
        ===
        allWeeks[
          allWeeks.length - 1
        ]

    });

  }


  return result;

}


function buildSongStats() {

  songStats =
    buildSongStatsForMode(
      $("pointMode").value
    );

}


// ============================================================
// アーティスト統計
// ============================================================

function buildArtistStats() {

  const mode =
    $("pointMode").value;


  const groups =
    new Map();


  for (
    const r
    of rows
  ) {

    if (
      !groups.has(
        r.mainArtist
      )
    ) {

      groups.set(
        r.mainArtist,
        []
      );

    }


    groups
      .get(
        r.mainArtist
      )
      .push(r);

  }


  artistStats = [];


  for (
    const [artist, items]
    of groups.entries()
  ) {

    const ranks =
      items.map(
        x => x.rank
      );


    const songs =
      new Set(

        items.map(
          x =>
            `${x.song}\u0000${x.artist}`
        )

      );


    const weeks =
      new Set(

        items.map(
          x => x.week
        )

      );


    const byWeek =
      new Map();


    const bySongPoints =
      new Map();


    for (
      const r
      of items
    ) {

      if (
        !byWeek.has(
          r.week
        )
      ) {

        byWeek.set(
          r.week,
          []
        );

      }


      byWeek
        .get(
          r.week
        )
        .push(r);


      const sk =
        `${r.song}\u0000${r.artist}`;


      bySongPoints.set(

        sk,

        (
          bySongPoints.get(sk)
          ||
          0
        )

        +

        point(
          r.rank,
          mode
        )

      );

    }


    let maxSimultaneous = 0;

    let maxTop10Simultaneous = 0;


    for (
      const weekItems
      of byWeek.values()
    ) {

      maxSimultaneous =
        Math.max(

          maxSimultaneous,

          weekItems.length

        );


      maxTop10Simultaneous =
        Math.max(

          maxTop10Simultaneous,

          weekItems.filter(
            x =>
              x.rank <= 10
          ).length

        );

    }


    const bestSongKey =
      [
        ...bySongPoints.entries()
      ]

      .sort(
        (a, b) =>
          b[1] - a[1]
      )[0]?.[0]

      ||

      "";


    const bestSong =
      bestSongKey
        .split(
          "\u0000"
        )[0]
      ||
      "";


    artistStats.push({

      artist,

      points:
        items.reduce(

          (s, x) =>
            s
            +
            point(
              x.rank,
              mode
            ),

          0

        ),

      songs:
        songs.size,

      chartWeeks:
        weeks.size,

      songWeeks:
        items.length,

      bestRank:
        Math.min(
          ...ranks
        ),

      avgRank:
        mean(
          ranks
        ),

      no1SongWeeks:
        ranks.filter(
          x => x === 1
        ).length,

      top10SongWeeks:
        ranks.filter(
          x => x <= 10
        ).length,

      maxSimultaneous,

      maxTop10Simultaneous,

      bestSong

    });

  }

}

// ============================================================
// 週間アーティスト数値マトリクス
// ============================================================

function buildWeeklyArtistMatrix(
  metric
) {

  const artists =
    topArtists();


  const mode =
    $("pointMode").value;


  const totalPoints =
    new Map(

      allWeeks.map(
        w =>
          [
            w,
            0
          ]
      )

    );


  const maps =
    new Map(

      artists.map(
        a =>
          [
            a,
            new Map()
          ]
      )

    );


  for (
    const r
    of rows
  ) {

    const p =
      point(
        r.rank,
        mode
      );


    totalPoints.set(

      r.week,

      (
        totalPoints.get(
          r.week
        )
        ||
        0
      )

      +

      p

    );


    if (
      !maps.has(
        r.mainArtist
      )
    ) {

      continue;

    }


    const m =
      maps.get(
        r.mainArtist
      );


    let add = 0;


    if (
      metric === "points"
      ||
      metric === "share"
    ) {

      add = p;

    }


    else if (
      metric === "songs"
    ) {

      add = 1;

    }


    else if (
      metric === "top10Songs"
    ) {

      add =
        r.rank <= 10
          ? 1
          : 0;

    }


    m.set(

      r.week,

      (
        m.get(
          r.week
        )
        ||
        0
      )

      +

      add

    );

  }


  const data =
    allWeeks.map(
      week => {

        const vals =
          artists.map(
            a => {

              const v =
                maps
                  .get(a)
                  .get(week)
                ||
                0;


              if (
                metric === "share"
              ) {

                const total =
                  totalPoints.get(
                    week
                  )
                  ||
                  0;


                return total

                  ? v
                    /
                    total
                    *
                    100

                  : 0;

              }


              return v;

            }
          );


        return {

          week,

          vals

        };

      }
    );


  return {

    artists,

    data

  };

}

// ============================================================

// ============================================================

function showArtistConcentration() {

  const mode =
    $("pointMode").value;


  const output = [];


  for (
    const week
    of allWeeks
  ) {

    const weekRows =
      rows.filter(
        r =>
          r.week === week
      );


    const artistPts =
      new Map();


    for (
      const r
      of weekRows
    ) {

      artistPts.set(

        r.mainArtist,

        (
          artistPts.get(
            r.mainArtist
          )
          ||
          0
        )

        +

        point(
          r.rank,
          mode
        )

      );

    }


    const vals =
      [
        ...artistPts.values()
      ]
      .sort(
        (a, b) =>
          b - a
      );


    const total =
      vals.reduce(
        (a, b) =>
          a + b,
        0
      );


    const share =
      k =>

        total

          ? vals
              .slice(
                0,
                k
              )
              .reduce(
                (a, b) =>
                  a + b,
                0
              )

            /
            total
            *
            100

          : 0;


    const hhi =

      total

        ? [
            ...artistPts.values()
          ]
          .reduce(

            (s, v) =>

              s

              +

              (
                v
                /
                total
                *
                100
              ) ** 2,

            0

          )

        : 0;


    output.push({

      week,

      artists:
        artistPts.size,

      top1:
        share(1),

      top3:
        share(3),

      top5:
        share(5),

      hhi

    });

  }


  $("resultTitle").textContent =
    "週別アーティスト集中度";


  $("resultInfo").textContent =
    "TOP1/TOP3/TOP5は、その週のTOP100ポイントに占める上位アーティストの合計シェア。HHIはシェア集中度。";


  showTable(

    [

      "TOP1シェア%",

      "TOP3シェア%",

      "HHI"

    output.map(
      x =>

          x.week,

          x.artists,

          x.top1.toFixed(3),

          x.top3.toFixed(3),

          x.top5.toFixed(3),

          x.hhi.toFixed(2)

        ]
    ),

    "artist_concentration.csv"

  );


  showMultiLineChart(

    "週別アーティスト集中度",

    output.map(
      x => x.week
    ),

    [

      {

        label:
          "TOP1",

        data:
          output.map(
            x => x.top1
          )

      },

      {

        label:
          "TOP3",

        data:
          output.map(
            x => x.top3
          )

      },

      {

        label:
          "TOP5",

        data:
          output.map(
            x => x.top5
          )

      }

    ],

    "シェア (%)"

  );

}


// ============================================================
// ポイント方式比較
// ============================================================

function showPointComparison() {

  const modes = [

    "linear",

    "log",

    "reciprocal"

  ];


  const statsByMode =
    Object.fromEntries(

      modes.map(
        m =>
          [
            m,
            buildSongStatsForMode(m)
          ]
      )

    );


  const rankMaps = {};


  for (
    const m
    of modes
  ) {

    const sorted =
      [...statsByMode[m]]

        .sort(
          (a, b) =>
            b.points - a.points
        );


    rankMaps[m] =
      new Map(

        sorted.map(
          (s, i) =>
            [
              s.key,
              i + 1
            ]
        )

      );

  }


  const base =
    statsByMode.log

      .map(
        s => {

          const r1 =
            rankMaps.linear.get(
              s.key
            );


          const r2 =
            rankMaps.log.get(
              s.key
            );


          const r3 =
            rankMaps.reciprocal.get(
              s.key
            );


          return {

            ...s,

            r1,

            r2,

            r3,

            avg:
              mean(
                [
                  r1,
                  r2,
                  r3
                ]
              ),

            spread:
              Math.max(
                r1,
                r2,
                r3
              )

              -

              Math.min(
                r1,
                r2,
                r3
              )

          };

        }
      )

      .sort(
        (a, b) =>
          a.avg - b.avg
      )

      .slice(
        0,
        Number(
          $("topN").value
        )
      );


  $("resultTitle").textContent =
    "3ポイント方式比較";


  $("resultInfo").textContent =
    "3方式での総合順位を並べます。順位差が大きい曲ほど、評価方式への依存が強い曲です。";


  showTable(

    [

      "曲名",

      "アーティスト",

      "101-順位方式",

      "対数方式",

      "100/順位方式",

      "平均順位",

      "最大順位差"

    ],

    base.map(
      s =>
        [

          s.song,

          s.artist,

          s.r1,

          s.r2,

          s.r3,

          s.avg.toFixed(2),

          s.spread

        ]
    ),

    "point_system_comparison.csv"

  );

}


// ============================================================
// 品質チェック
// ============================================================

function qualityCheck() {

  const errors = [];


  const byWeek =
    new Map();


  for (
    const r
    of allLoadedRows
  ) {

    if (
      !byWeek.has(
        r.week
      )
    ) {

      byWeek.set(
        r.week,
        []
      );

    }


    byWeek
      .get(
        r.week
      )
      .push(r);


    if (
      !Number.isInteger(
        r.rank
      )

      ||

      r.rank < 1

      ||

      r.rank > 100
    ) {

      errors.push([

        "順位範囲外",

        r.week,

        `${r.song} / ${r.artist}: ${r.rank}`

      ]);

    }


    if (
      !r.song
      ||
      !r.artist
      ||
      !r.week
    ) {

      errors.push([

        "必須値欠落",

        r.week || "(日付なし)",

        `${r.song} / ${r.artist}`

      ]);

    }

  }


  for (
    const [week, items]
    of byWeek.entries()
  ) {

    const rankCount =
      new Map();


    const songSeen =
      new Set();


    for (
      const r
      of items
    ) {

      rankCount.set(

        r.rank,

        (
          rankCount.get(
            r.rank
          )
          ||
          0
        )

        +

        1

      );


      const sk =
        `${r.song}\u0000${r.artist}`;


      if (
        songSeen.has(sk)
      ) {

        errors.push([

          "同一曲週重複",

          week,

          `${r.song} / ${r.artist}`

        ]);

      }


      songSeen.add(sk);

    }


    for (
      const [rank, count]
      of rankCount.entries()
    ) {

      if (
        count > 1
      ) {

        errors.push([

          "順位重複",

          week,

          `${rank}位が${count}件`

        ]);

      }

    }


    const validRanks =
      new Set(

        items

          .filter(
            r =>
              r.rank >= 1
              &&
              r.rank <= 100
          )

          .map(
            r => r.rank
          )

      );


    const missing = [];


    for (
      let rank = 1;
      rank <= 100;
      rank++
    ) {

      if (
        !validRanks.has(
          rank
        )
      ) {

        missing.push(
          rank
        );

      }

    }


    if (
      missing.length
    ) {

      errors.push([

        "欠落順位",

        week,

        missing.join(", ")

      ]);

    }

  }


  return errors;

}

// ============================================================
// 曲詳細
// ============================================================

function showSongDetail(
  s
) {

  $("resultTitle").textContent =
    `${s.song} / ${s.artist}`;


  $("resultInfo").innerHTML = `

    ポイント ${s.points.toFixed(1)}
    /
    登場 ${s.weeks}週
    /
    最高 ${s.bestRank}位
    /
    平均 ${s.avgRank.toFixed(2)}位
    /
    TOP10 ${s.top10Weeks}週
    /
    再登場 ${s.reentries}回
    /
    順位標準偏差 ${s.rankStd.toFixed(2)}
    /
    最大週間上昇 ${s.biggestRise}
    /
    最大週間下落 ${s.biggestFall}

  `;


  showTable(

    [

      "週",

      "順位",

      "変動"

    ],

    s.entries.map(
      r =>
        [

          r.week,

          r.rank,

          r.raw["変動"]
          ||
          ""

        ]
    ),

    `${s.song}_history.csv`

  );


  const map =
    new Map(

      s.entries.map(
        r =>
          [
            r.week,
            r.rank
          ]
      )

    );


  const first =
    allWeeks.indexOf(
      s.firstDate
    );


  const last =
    allWeeks.indexOf(
      s.lastDate
    );


  const labels =
    allWeeks.slice(
      first,
      last + 1
    );


  const values =
    labels.map(
      w =>

        map.has(w)

          ? map.get(w)

          : null
    );


  $("chartCard").hidden =
    false;


  $("chartTitle").textContent =
    `${s.song} / ${s.artist} 順位推移`;


  destroyChart();


  currentChart =
    new Chart(

      $("chart"),

      {

        type:
          "line",

        data: {

          labels,

          datasets:
            [

              {

                label:
                  "順位",

                data:
                  values,

                spanGaps:
                  false,

                tension:
                  0,

                pointRadius:
                  4

              }

            ]

        },


        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          scales: {

            y: {

              reverse:
                true,

              min:
                1,

              max:
                100,

              title: {

                display:
                  true,

                text:
                  "順位"

              }

            }

          }

        }

      }

    );

}


// ============================================================
// アーティスト個別週次データ
// ============================================================

function showArtistDetail(
  artist
) {

  const mode =
    $("pointMode").value;


  const weeksData = [];


  for (
    const week
    of allWeeks
  ) {

    const wr =
      rows.filter(
        r =>
          r.week === week
          &&
          r.mainArtist === artist
      );


    const pts =
      wr.reduce(

        (s, r) =>
          s
          +
          point(
            r.rank,
            mode
          ),

        0

      );


    weeksData.push({

      week,

      points:
        pts,

      songs:
        wr.length,

      top10:
        wr.filter(
          r =>
            r.rank <= 10
        ).length,

      best:
        wr.length

          ? Math.min(
              ...wr.map(
                r => r.rank
              )
            )

          : ""

    });

  }


  $("resultTitle").textContent =
    `${artist} 週間データ`;


  $("resultInfo").textContent =
    "週ごとのポイント・ランクイン曲数・TOP10曲数・最高順位。数値のままCSV保存できます。";


  showTable(

    [

      "週",

      "ポイント",

      "ランクイン曲数",

      "TOP10曲数",

      "その週の最高順位"

    ],

    weeksData.map(
      x =>
        [

          x.week,

          x.points.toFixed(2),

          x.songs,

          x.top10,

          x.best

        ]
    ),

    `${artist}_weekly.csv`

  );


  showMultiLineChart(

    `${artist} 週間ポイント`,

    weeksData.map(
      x => x.week
    ),

    [

      {

        label:
          artist,

        data:
          weeksData.map(
            x => x.points
          )

      }

    ],

    "ポイント"

  );

}


// ============================================================
// 検索
// ============================================================

function updateSongSearch() {

  const q =
    $("songSearch")
      .value
      .trim()
      .toLowerCase();


  const box =
    $("songSearchResults");


  if (!q) {

    box.innerHTML =
      "";

    return;

  }


  const hits =
    songStats

      .filter(
        s =>

          s.song
            .toLowerCase()
            .includes(q)

          ||

          s.artist
            .toLowerCase()
            .includes(q)
      )

      .slice(
        0,
        30
      );


  box.innerHTML =
    hits.map(
      s =>
        `
        <button data-key="${encodeURIComponent(s.key)}">
          ${esc(s.song)} / ${esc(s.artist)}
        </button>
        `
    )
    .join("");


  box
    .querySelectorAll(
      "button"
    )
    .forEach(
      btn =>

        btn.addEventListener(
          "click",
          () => {

            const s =
              songStats.find(
                x =>
                  x.key
                  ===
                  decodeURIComponent(
                    btn.dataset.key
                  )
              );


            if (s) {

              showSongDetail(s);

            }

          }
        )
    );

}


function updateArtistSearch() {

  const q =
    $("artistSearch")
      .value
      .trim()
      .toLowerCase();


  const box =
    $("artistSearchResults");


  if (!q) {

    box.innerHTML =
      "";

    return;

  }


  const hits =
    artistStats

      .filter(
        a =>
          a.artist
            .toLowerCase()
            .includes(q)
      )

      .sort(
        (a, b) =>
          b.points - a.points
      )

      .slice(
        0,
        30
      );


  box.innerHTML =
    hits.map(
      a =>
        `
        <button data-artist="${encodeURIComponent(a.artist)}">
          ${esc(a.artist)}
          (${a.points.toFixed(1)} pt)
        </button>
        `
    )
    .join("");


  box
    .querySelectorAll(
      "button"
    )
    .forEach(
      btn =>

        btn.addEventListener(
          "click",
          () =>

            showArtistDetail(

              decodeURIComponent(
                btn.dataset.artist
              )

            )

        )
    );

}


// ============================================================
// CSV保存
// ============================================================

function exportCurrentTable() {

  if (
    !currentTable.headers.length
  ) {

    return;

  }


  const data = [

    currentTable.headers,

    ...currentTable.rows

  ];


  const csv =
    Papa.unparse(
      data
    );


  const blob =
    new Blob(

      [
        "\uFEFF"
        +
        csv
      ],

      {
        type:
          "text/csv;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    currentTable.filename
    ||
    "analysis.csv";


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );

}


// ============================================================
// CSV読み込みイベント
// ============================================================

$("csvFile")
  .addEventListener(
    "change",
    e => {

      const file =
        e.target.files[0];


      if (!file) {

        return;

      }


      $("status").textContent =
        "CSV読み込み中…";


      Papa.parse(

        file,

        {

          header:
            true,

          skipEmptyLines:
            true,


          complete:
            result => {

              const fields =
                result.meta.fields
                ||
                [];


              const missing =
                validateRequiredColumns(
                  fields
                );


              if (
                missing.length
              ) {

                $("status").textContent =
                  `必要な列がありません: ${missing.join(", ")}`;

                return;

              }


              allLoadedRows =
                result.data

                  .map(
                    normalizeRow
                  )

                  .filter(
                    r =>
                      r.week
                      &&
                      Number.isInteger(
                        r.rank
                      )
                  )

                  .sort(
                    (a, b) =>
                      a.week.localeCompare(
                        b.week
                      )
                      ||
                      a.rank - b.rank
                  );


              if (
                !allLoadedRows.length
              ) {

                $("status").textContent =
                  "有効なデータがありません。";

                return;

              }


              const weeks =
                [
                  ...new Set(
                    allLoadedRows.map(
                      r => r.week
                    )
                  )
                ]
                .sort();


              $("startDate").value =
                weeks[0];


              $("endDate").value =
                weeks[
                  weeks.length - 1
                ];


              $("startDate").min =
                weeks[0];


              $("startDate").max =
                weeks[
                  weeks.length - 1
                ];


              $("endDate").min =
                weeks[0];


              $("endDate").max =
                weeks[
                  weeks.length - 1
                ];


              applyDateFilter();


              $("menuCard").hidden =
                false;


              $("searchCard").hidden =
                false;


              $("status").textContent =
                `読み込み完了: ${file.name}`;


              showSongRanking(

                "points",

                "曲別ポイント"

              );

            },


          error:
            err => {

              $("status").textContent =
                `CSV読み込みエラー: ${err.message}`;

            }

        }

      );

    }
  );


// ============================================================
// 期間イベント
// ============================================================

$("applyFilter")
  .addEventListener(
    "click",
    () => {

      if (
        !allLoadedRows.length
      ) {

        return;

      }


      if (
        $("startDate").value

        &&

        $("endDate").value

        &&

        $("startDate").value
        >
        $("endDate").value
      ) {

        alert(
          "開始週が終了週より後になっています。"
        );

        return;

      }


      applyDateFilter();


      showSongRanking(

        "points",

        "曲別ポイント"

      );

    }
  );


$("resetFilter")
  .addEventListener(
    "click",
    () => {

      if (
        !allLoadedRows.length
      ) {

        return;

      }


      const weeks =
        [
          ...new Set(
            allLoadedRows.map(
              r => r.week
            )
          )
        ]
        .sort();


      $("startDate").value =
        weeks[0];


      $("endDate").value =
        weeks[
          weeks.length - 1
        ];


      applyDateFilter();


      showSongRanking(

        "points",

        "曲別ポイント"

      );

    }
  );

$("pointMode")

// メニューイベント

document

      btn.addEventListener(

          if (

            showSongRanking(

              "曲別ポイント"
            );

          else if (

            showSongRanking(

              "登場週数"
            );

          }


          else if (
            a === "songStreak"
          ) {

            showSongRanking(
              "streak",
              "最長連続登場週数"
            );

          }


          else if (
            a === "songTop10"
          ) {

            showSongRanking(
              "top10Weeks",
              "TOP10滞在週数"
            );

          }


          else if (
            a === "songNo1"
          ) {

            showSongRanking(
              "no1Weeks",
              "1位獲得週数"
            );

          }


          else if (
            a === "lateBloomers"
          ) {

            showLateBloomers();

          }


          else if (
            a === "stableSongs"
          ) {

            showSongRanking(

              "rankStd",

              "順位標準偏差",

              true,

              s =>
                s.weeks >= 5

            );

          }


          else if (
            a === "reentries"
          ) {

            showSongRanking(
              "reentries",
              "再登場回数"
            );

          }


          else if (
            a === "biggestRise"
          ) {

            showSongRanking(
              "biggestRise",
              "週間最大上昇"
            );

          }


          else if (
            a === "artistPoints"
          ) {

            showArtistRanking();

          }


          else if (
            a === "weeklyArtistPoints"
          ) {

            showWeeklyArtistMetric(
              "points"
            );

          }


          else if (
            a === "weeklyArtistShare"
          ) {

            showWeeklyArtistMetric(
              "share"
            );

          }


          else if (
            a === "weeklyArtistSongs"
          ) {

            showWeeklyArtistMetric(
              "songs"
            );

          }


          else if (
            a === "weeklyArtistTop10Songs"
          ) {

            showWeeklyArtistMetric(
              "top10Songs"
            );

          }


          else if (
            a === "artistConcentration"
          ) {

            showArtistConcentration();

          }


          else if (
            a === "pointCompare"
          ) {

            showPointComparison();

          }


          else if (
            a === "quality"
          ) {

            showQuality();

          }


          else if (
            a === "no1History"
          ) {

            showNo1History();

          }

        }
      );

    }
  );

</script>
